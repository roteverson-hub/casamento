    <style>
        .font-dancing  { font-family: 'Dancing Script', cursive; }
        .font-playfair { font-family: 'Playfair Display', serif; }

        /* ── Animations ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes orbFloat {
            0%, 100% { transform: translateY(0) scale(1);   opacity: 0.18; }
            50%       { transform: translateY(-16px) scale(1.06); opacity: 0.26; }
        }

        .anim-fade-up { animation: fadeUp 0.65s cubic-bezier(.22,1,.36,1) forwards; }
        .anim-fade-in { animation: fadeIn 0.5s ease forwards; }

        .d1 { animation-delay: 0.08s; opacity: 0; }
        .d2 { animation-delay: 0.18s; opacity: 0; }
        .d3 { animation-delay: 0.30s; opacity: 0; }
        .d4 { animation-delay: 0.42s; opacity: 0; }
        .d5 { animation-delay: 0.56s; opacity: 0; }

        html { scroll-behavior: smooth; }

        /* Custom scrollbar */
        ::-webkit-scrollbar       { width: 6px; }
        ::-webkit-scrollbar-track { background: #fff; }
        ::-webkit-scrollbar-thumb { background: #fecdd3; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #fda4af; }

        /* ── Decorative orbs ── */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            pointer-events: none;
            animation: orbFloat 7s ease-in-out infinite;
        }

        /* ── Nav underline ── */
        .nav-link { position: relative; padding-bottom: 2px; }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 0; height: 1px;
            background: #fb7185;
            transition: width 0.3s ease;
        }
        .nav-link:hover::after { width: 100%; }

        /* ── Photo grid ── */
        /*
          Desktop: 3 cols, 2 rows. First photo spans col 1-2 and both rows.
          Remaining 5 photos fill col 3, rows 1-2, then a third row across full width.
          Mobile: clean 2-column grid, all square, no spanning.
        */
        .photo-grid {
            display: grid;
            gap: 10px;
        }

        /* Mobile: 2 equal columns, all square */
        @media (max-width: 639px) {
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 160px;
            }
            .photo-item-0 { grid-column: 1 / 3; height: 220px; }
        }

        /* Tablet+ : masonry-like layout */
        @media (min-width: 640px) {
            .photo-grid {
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: repeat(2, 230px);
            }
            .photo-item-0 {
                grid-column: 1 / 3;
                grid-row: 1 / 3;
            }
        }

        @media (min-width: 1024px) {
            .photo-grid { grid-template-rows: repeat(2, 280px); }
        }

        .photo-grid > div {
            border-radius: 18px;
            overflow: hidden;
            position: relative;
        }
        .photo-grid > div img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.7s cubic-bezier(.22,1,.36,1);
            display: block;
        }
        .photo-grid > div:hover img { transform: scale(1.07); }

        /* Countdown box */
        .countdown-box {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .countdown-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(251,113,133,0.18);
        }

        .line-divider {
            display: block;
            width: 48px; height: 1px;
            background: linear-gradient(90deg, transparent, #fda4af, transparent);
            margin: 0 auto;
        }
    </style>
</head>

                                    </div>

                                    {/* Location */}
                                    <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-rose-50 relative overflow-hidden group">
                                        <div className="absolute -top-8 -right-8 w-28 h-28 bg-rose-100 rounded-full opacity-20 group-hover:opacity-35 group-hover:scale-150 transition-all duration-700" />
                                        <h3 className="text-sm font-bold uppercase tracking-[0.2em] mb-2 text-slate-800">Espaço Belluno</h3>
                                        <p className="text-slate-500 text-sm leading-relaxed mb-5">
                                            Av. Dr. Joaquim Craveiro de Sá, quadra B1 lote 12<br/>
                                            Expansul, Aparecida de Goiânia — GO<br/>
                                            CEP: 74986-320
                                        </p>
                                        <a href="https://maps.app.goo.gl/xVw6fqBjbb7mFrNu9" target="_blank"
                                           className="inline-flex items-center gap-2 text-rose-400 text-[10px] font-bold uppercase tracking-widest hover:text-rose-500 transition-colors">
                                            Ver no Mapa <span className="text-sm">→</span>
                                        </a>
                                    </div>
                                </div>

                                {/* Venue photos — stagger only on desktop to avoid mobile clipping */}
                                <div className="grid grid-cols-2 gap-3 md:gap-5">
                                    {VENUE_PHOTOS.map((img, idx) => (
                                        <div key={idx}
                                             className={`rounded-2xl overflow-hidden shadow-md hover:shadow-xl transition-shadow duration-500 ${idx % 2 === 0 ? 'md:mt-6' : 'md:-mt-6'}`}
                                             style={{aspectRatio:'4/3'}}>
                                            <img src={img} alt="Espaço Belluno"
                                                 className="w-full h-full object-cover hover:scale-110 transition-transform duration-700"
                                                 loading="lazy" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* ── RSVP ── */}
                    <section id="rsvp" className="bg-slate-50 py-20 md:py-28 px-5 md:px-6">
                        <div className="max-w-xl mx-auto bg-white p-8 md:p-12 rounded-[2.5rem] shadow-2xl relative overflow-hidden min-h-[400px] flex flex-col">
                            <div className="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b from-rose-200 via-rose-300 to-rose-100" />
                            <div className="text-center mb-10">
                                <p className="text-[10px] uppercase tracking-[0.35em] text-rose-300 font-semibold mb-2">Você está na lista?</p>
                                <h2 className="text-3xl font-playfair mb-1">Confirmar Presença</h2>
                                <p className="text-slate-400 text-xs italic">Busca inteligente por nome.</p>
                            </div>

                            {finished ? (
                                <div className="text-center py-10 anim-fade-in flex-grow flex flex-col justify-center">
                                    <div className="w-16 h-16 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6 ring-4 ring-green-100">
                                        <span className="text-green-500 text-2xl">✓</span>
                                    </div>
                                    <h3 className="text-2xl font-playfair text-slate-800 mb-2">Presença Confirmada!</h3>
                                    <p className="text-slate-500">Obrigado por responder.</p>
                                    <button onClick={() => { setFinished(false); setGrouped(null); setInvite(null); setSearchName(''); }}
                                            className="mt-8 text-rose-300 font-bold uppercase text-[10px] tracking-widest border-b border-rose-100 inline-block mx-auto">
                                        Confirmar outro
                                    </button>
                                </div>
                            ) : !groupedResults ? (
                                <div className="space-y-4 anim-fade-in">
                                    <input type="text" value={searchName}
                                           onChange={e => setSearchName(e.target.value)}
                                           onKeyPress={e => e.key === 'Enter' && handleSearch()}
                                           placeholder="Ex: Leticia"
                                           className="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-rose-100 transition-all border border-transparent focus:border-rose-200 text-slate-800" />
                                    {error && <p className="text-rose-500 text-[10px] text-center uppercase tracking-wider">{error}</p>}
                                    <button onClick={handleSearch} disabled={loading}
                                            className="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold uppercase tracking-widest text-xs hover:bg-black transition-all disabled:opacity-50">
                                        {loading ? "Buscando..." : "Buscar Convite"}
                                    </button>
                                </div>
                            ) : !selectedInvite ? (
                                <div className="anim-fade-in space-y-4">
                                    <p className="text-center text-slate-500 text-sm mb-6">Escolha o seu convite:</p>
                                    {Object.keys(groupedResults).map(name => (
                                        <button key={name} onClick={() => selectInvite(name, groupedResults[name])}
                                                className="w-full p-5 bg-white border border-slate-100 rounded-2xl text-left hover:border-rose-200 hover:shadow-md transition-all flex justify-between items-center group">
                                            <span className="font-playfair text-lg text-slate-800 group-hover:text-rose-400">{name}</span>
                                            <span className="text-slate-300 group-hover:translate-x-1 transition-transform">→</span>
                                        </button>
                                    ))}
                                    <button onClick={() => setGrouped(null)}
                                            className="w-full text-slate-400 text-[10px] uppercase tracking-widest mt-6 hover:text-slate-600 transition-colors">
                                        Voltar
                                    </button>
                                </div>
                            ) : (
                                <div className="anim-fade-in">
                                    <div className="mb-8 p-6 bg-rose-50/50 rounded-3xl border border-rose-100 text-center">
                                        <span className="text-[10px] text-rose-300 uppercase tracking-[0.2em] font-bold">Convite selecionado</span>
                                        <h4 className="text-2xl font-playfair text-slate-800 mt-2">{selectedInvite.name}</h4>
                                    </div>
                                    <div className="space-y-3 mb-8">
                                        {selectedInvite.guests.map(g => {
                                            const uKey = getKey(g);
                                            const isSel = !!attendance[uKey];
                                            return (
                                                <div key={uKey} onClick={() => toggleAttendance(g)}
                                                     className={`flex items-center justify-between p-4 rounded-2xl border cursor-pointer transition-all duration-300 ${isSel ? 'bg-white border-rose-300 shadow-md scale-[1.02]' : 'bg-slate-50 border-transparent opacity-70 hover:opacity-100'}`}>
                                                    <span className={`font-medium transition-colors ${isSel ? 'text-slate-900 font-bold' : 'text-slate-500'}`}>{g.nomeIndividual}</span>
                                                    <div className={`w-7 h-7 rounded-full border-2 flex items-center justify-center transition-all duration-300 ${isSel ? 'bg-rose-400 border-rose-400' : 'border-slate-300'}`}>
                                                        {isSel && <span className="text-white text-sm font-bold">✓</span>}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <button onClick={submitRSVP} disabled={isSubmitting}
                                            className="w-full bg-rose-400 text-white py-4 rounded-2xl font-bold uppercase tracking-widest text-xs hover:bg-rose-500 shadow-lg shadow-rose-100 disabled:opacity-50 transition-all">
                                        {isSubmitting ? "Enviando..." : "Confirmar Presença"}
                                    </button>
                                    <button onClick={() => setInvite(null)}
                                            className="w-full text-slate-400 text-[10px] uppercase tracking-widest mt-6 hover:text-slate-600 transition-colors">
                                        Trocar convite
                                    </button>
                                </div>
                            )}
                        </div>
                    </section>

                    {/* ── GIFTS ── */}
                    <section id="presentes" className="py-20 md:py-28 px-5 md:px-6 max-w-6xl mx-auto">
                        <div className="text-center mb-14">
                            <p className="text-[10px] uppercase tracking-[0.35em] text-rose-300 font-semibold mb-3">Com carinho</p>
                            <h2 className="text-4xl font-playfair mb-3">Lista de Presentes</h2>
                            <span className="line-divider mb-4" />
                            <p className="text-slate-400 text-sm max-w-lg mx-auto italic">Contribua para nossa nova etapa de vida.</p>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-10">
                            {GIFTS_DATA.map(gift => (
                                <div key={gift.id} className="bg-white group rounded-[2.5rem] p-4 border border-slate-50 shadow-sm hover:shadow-2xl transition-all duration-500 flex flex-col">
                                    <div className="w-full aspect-square rounded-[2rem] overflow-hidden mb-6">
                                        <img src={gift.image} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" alt={gift.title} loading="lazy" />
                                    </div>
                                    <div className="px-2 flex-grow flex flex-col">
                                        <h3 className="text-xl font-playfair text-slate-800 mb-2">{gift.title}</h3>
                                        <p className="text-slate-400 text-[11px] mb-4 line-clamp-2">{gift.desc}</p>
                                        <div className="mt-auto flex justify-between items-center pt-4 border-t border-slate-50">
                                            <p className="text-lg font-bold text-slate-900">R$ {gift.price.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
                                            <button onClick={() => setSelectedGift(gift)}
                                                    className="bg-slate-900 text-white px-5 py-3 rounded-xl text-[9px] uppercase tracking-widest font-bold hover:bg-black transition-all">
                                                Presentear
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* ── PAYMENT MODAL ── */}
                    {selectedGift && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setSelectedGift(null)} />
                            <div className="bg-white rounded-[2rem] p-6 md:p-8 w-full max-w-md relative z-10 shadow-2xl anim-fade-in flex flex-col items-center text-center">
                                <button onClick={() => setSelectedGift(null)} className="absolute top-5 right-6 text-slate-300 hover:text-slate-600 transition-colors text-xl font-bold">✕</button>
                                <div className="w-28 h-28 rounded-full overflow-hidden mb-5 border-4 border-rose-100">
                                    <img src={selectedGift.image} className="w-full h-full object-cover" alt={selectedGift.title} />
                                </div>
                                <h3 className="text-2xl font-playfair text-slate-900 mb-2">{selectedGift.title}</h3>
                                <p className="text-slate-500 text-sm mb-4 leading-relaxed px-4">{selectedGift.desc}</p>
                                <p className="text-3xl font-bold text-rose-500 mb-8 font-playfair">R$ {selectedGift.price.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
                                <div className="flex flex-col gap-3 w-full">
                                    <a href={selectedGift.linkpix} target="_blank"
                                       className="w-full bg-[#820ad1] text-white py-4 rounded-xl font-bold uppercase tracking-widest text-xs hover:bg-[#6d06b0] shadow-lg shadow-purple-100 hover:shadow-xl transition-all flex items-center justify-center gap-3 hover:-translate-y-1">
                                        <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.01 21.05l-7.4-4.2a1.6 1.6 0 010-2.8l7.4-4.2 7.39 4.2a1.6 1.6 0 010 2.8l-7.4 4.2zm-9.01-6.1l8.1 4.6a1.8 1.8 0 001.8 0l8.1-4.6a1.8 1.8 0 000-3.13l-8.1-4.6a1.8 1.8 0 00-1.8 0l-8.1 4.6a1.8 1.8 0 000 3.14zM12 2.95l7.4 4.2-2.5 1.43-4.9-2.8-4.9 2.8-2.5-1.43 7.4-4.2z"/></svg>
                                        Pagar com Pix
                                    </a>
                                    <a href={selectedGift.linkcartao} target="_blank"
                                       className="w-full bg-[#009ee3] text-white py-4 rounded-xl font-bold uppercase tracking-widest text-xs hover:bg-[#007eb5] shadow-lg shadow-sky-100 hover:shadow-xl transition-all flex items-center justify-center gap-3 hover:-translate-y-1">
                                        <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
                                        Pagar com Cartão
                                    </a>
                                </div>
                                <p className="mt-6 text-[10px] text-slate-300 uppercase tracking-wider">Seguro e rápido</p>
                            </div>
                        </div>
                    )}

                    {/* ── FOOTER ── */}
                    <footer className="py-12 text-center border-t border-slate-100">
                        <p className="font-dancing text-3xl text-slate-400 mb-1">{COUPLE_NAMES}</p>
                        <p className="text-[9px] uppercase tracking-[0.45em] text-slate-300 mt-1">02 · 05 · 2026</p>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
