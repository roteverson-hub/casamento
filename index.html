                        days: Math.max(0, Math.floor(difference / (1000 * 60 * 60 * 24))),
                        hours: Math.max(0, Math.floor((difference / (1000 * 60 * 60)) % 24)),
                        minutes: Math.max(0, Math.floor((difference / 1000 / 60) % 60)),
                        seconds: Math.max(0, Math.floor((difference / 1000) % 60))
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, []);

                const query = searchName.trim();
                
                if (query.length < 3) {
                    setError('Por favor, digite pelo menos 3 letras.');
                    return;
                }
                setError('');
                setLoading(true);
                try {
                    const response = await fetch(`${SCRIPT_URL}?nome=${encodeURIComponent(query)}`);
                    const data = await response.json();
                    
                    if (data && data.length > 0) {
                        const groups = data.reduce((acc, curr) => {
                            const key = curr.nomeConvite;
                            if (!acc[key]) acc[key] = [];
                            acc[key].push(curr);
                            return acc;
                        }, {});
                        
                        setGroupedResults(groups);
                        
                        if (Object.keys(groups).length === 1) {
                            selectInvite(Object.keys(groups)[0], groups[Object.keys(groups)[0]]);
                        }
                    } else {
                        setError('Nenhum convite encontrado. Tente apenas o primeiro nome ou verifique a grafia.');
                    }
                } catch (err) {
                    setError('Ocorreu um erro na busca. Tente novamente.');
                } finally {
                    setLoading(false);
                }
            };

                guests.forEach(g => initialAttendance[getUniqueKey(g)] = g.situacao === "Confirmado");
                setAttendance(initialAttendance);
                setSelectedInvite({ name, guests });
            };

                    nomeIndividual: g.nomeIndividual,
                    presente: !!attendance[getUniqueKey(g)]

                                            { label: 'Seg', value: timeLeft.seconds }
                                        ].map((item) => (
                                            <div key={item.label} className="bg-white/60 backdrop-blur-sm px-4 py-5 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.03)] border border-emerald-50 w-[72px] md:w-[88px] flex flex-col items-center justify-center">
                                                <span className="block text-2xl md:text-3xl font-normal text-emerald-800 font-playfair mb-1">{item.value}</span>
                                                <span className="text-[9px] uppercase tracking-[0.2em] text-slate-400 font-medium">{item.label}</span>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Location */}
                                    <div className="bg-white p-8 md:p-10 rounded-[2rem] shadow-[0_10px_40px_rgb(0,0,0,0.04)] border border-emerald-50 relative overflow-hidden group hover:shadow-[0_10px_40px_rgb(0,0,0,0.08)] transition-all duration-500">
                                        <div className="absolute -top-10 -right-10 w-32 h-32 bg-emerald-50 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-700"></div>
                                        <h3 className="text-xl md:text-2xl font-playfair mb-4 text-slate-900 relative z-10">Espaço Belluno</h3>
                                        <p className="text-slate-500 mb-8 text-sm md:text-base leading-relaxed font-light relative z-10">
                                            Av. Dr. Joaquim Craveiro de Sá, quadra B1 lote 12<br/>
                                            Expansul, Aparecida de Goiânia - GO<br/>
                                            CEP: 74986-320
                                        </p>
                                        <a 
                                            href="https://maps.app.goo.gl/xVw6fqBjbb7mFrNu9" 
                                            target="_blank"
                                            className="inline-flex items-center justify-center w-full md:w-auto bg-emerald-800 text-white px-8 py-4 rounded-full text-[10px] font-bold uppercase tracking-widest hover:bg-emerald-900 transition-all hover:-translate-y-1 relative z-10 shadow-lg shadow-emerald-900/20"
                                        >
                                            Ver no Mapa
                                        </a>
                                    </div>
                                </div>

                                {/* Right Content: Venue Photos (Aquarela) */}
                                <div className="flex items-center justify-center animate-fade-in w-full">
                                    <img 
                                        src={VENUE_PHOTOS[0]} 
                                        alt="Ilustração Espaço Belluno" 
                                        className="w-full max-w-md lg:max-w-[120%] h-auto object-contain hover:scale-[1.02] transition-transform duration-1000 opacity-95 lg:-ml-10"
                                        style={{ mixBlendMode: 'multiply' }}
                                    />
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* RSVP Section */}
                    <section id="rsvp" className="bg-gradient-to-b from-white to-emerald-50/40 py-24 px-6 relative">
                        <div className="max-w-lg mx-auto bg-white p-8 md:p-12 rounded-[3rem] shadow-[0_20px_60px_rgb(0,0,0,0.05)] border border-slate-50 relative overflow-hidden flex flex-col">
                            <div className="absolute top-0 inset-x-0 h-2 bg-emerald-700" />
                            <div className="text-center mb-8 mt-2">
                                <h2 className="text-3xl md:text-4xl font-playfair mb-3 text-slate-900">Confirmar Presença</h2>
                                <p className="text-slate-400 text-xs font-light">Use o nome recebido no convite para a busca.</p>
                            </div>

                            {finished ? (
                                <div className="text-center py-4 animate-fade-in flex flex-col justify-center">
                                    <div className="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                                        <span className="text-emerald-500 text-3xl">✓</span>
                                    </div>
                                    <h3 className="text-2xl font-playfair text-slate-800 mb-3">Presença Confirmada!</h3>
                                    <p className="text-slate-500 text-sm font-light mb-8">Obrigado por responder. Estamos ansiosos para te ver!</p>
                                    <button onClick={() => { setFinished(false); setGroupedResults(null); setSelectedInvite(null); setSearchName(''); }} className="text-emerald-700 font-bold uppercase text-[10px] tracking-[0.2em] border-b border-emerald-200 inline-block mx-auto hover:text-emerald-900 transition-colors pb-1">Confirmar outro convite</button>
                                </div>
                            ) : !groupedResults ? (
                                <div className="space-y-5 animate-fade-in flex flex-col">
                                    <div>
                                        <input 
                                            type="text" 
                                            value={searchName}
                                            onChange={(e) => setSearchName(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && handleRSVPSearch()}
                                            placeholder="Ex: Vitor e Família" 
                                            className="w-full p-5 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-200 transition-all border border-slate-100 focus:border-emerald-300 text-center text-sm"
                                        />
                                        {error && <p className="text-red-400 text-[10px] text-center uppercase tracking-wider mt-3 font-medium">{error}</p>}
                                    </div>
                                    <button onClick={handleRSVPSearch} className="w-full bg-emerald-800 text-white py-5 rounded-2xl font-bold uppercase tracking-widest text-[11px] hover:bg-emerald-900 shadow-xl shadow-emerald-900/20 transition-all hover:-translate-y-0.5 disabled:opacity-50 disabled:hover:translate-y-0" disabled={loading}>
                                        {loading ? "Buscando..." : "Buscar Convite"}
                                    </button>
                                </div>
                            ) : !selectedInvite ? (
                                <div className="animate-fade-in space-y-4 flex flex-col">
                                    <p className="text-center text-slate-500 text-sm mb-4 font-light">Encontramos algumas opções. Qual é o seu?</p>
                                    <div className="space-y-3 overflow-y-auto max-h-[250px] pr-2 custom-scrollbar">
                                        {Object.keys(groupedResults).map((name) => (
                                            <button 
                                                key={name}
                                                onClick={() => selectInvite(name, groupedResults[name])}
                                                className="w-full p-5 bg-white border border-slate-100 rounded-2xl text-left hover:border-emerald-300 hover:shadow-lg hover:shadow-emerald-50 transition-all flex justify-between items-center group"
                                            >
                                                <span className="font-playfair text-lg text-slate-700 group-hover:text-emerald-800">{name}</span>
                                                <span className="text-emerald-300 group-hover:translate-x-1 transition-transform">→</span>
                                            </button>
                                        ))}
                                    </div>
                                    <button onClick={() => setGroupedResults(null)} className="w-full text-slate-400 text-[10px] uppercase tracking-[0.2em] mt-6 hover:text-slate-700 transition-colors font-semibold">← Voltar à busca</button>
                                </div>
                            ) : (
                                <div className="animate-fade-in flex flex-col">
                                    <div className="mb-6 p-5 bg-emerald-50/50 rounded-2xl border border-emerald-100/50 text-center">
                                        <span className="text-[9px] text-emerald-600 uppercase tracking-[0.2em] font-bold block mb-1">Convite selecionado</span>
                                        <h4 className="text-xl font-playfair text-slate-800">{selectedInvite.name}</h4>
                                    </div>
                                    <div className="space-y-3 mb-8 overflow-y-auto max-h-[200px] pr-2 custom-scrollbar">
                                        {selectedInvite.guests.map((g) => {
                                            const uKey = getUniqueKey(g);
                                            const isSelected = !!attendance[uKey];
                                            return (
                                                <div 
                                                    key={uKey} 
                                                    onClick={() => toggleAttendance(g)} 
                                                    className={`flex items-center justify-between p-4 rounded-xl border cursor-pointer transition-all duration-300 ${isSelected ? 'bg-white border-emerald-500 shadow-md shadow-emerald-100/50 transform scale-[1.02]' : 'bg-slate-50 border-transparent opacity-80 hover:opacity-100 hover:bg-slate-100'}`}
                                                >
                                                    <span className={`font-medium text-sm transition-colors ${isSelected ? 'text-emerald-900 font-bold' : 'text-slate-500'}`}>{g.nomeIndividual}</span>
                                                    <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all duration-300 ${isSelected ? 'bg-emerald-600 border-emerald-600' : 'border-slate-300 bg-transparent'}`}>
                                                        {isSelected && <svg className="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <button 
                                        onClick={submitRSVP} 
                                        disabled={isSubmitting}
                                        className="w-full bg-emerald-800 text-white py-5 rounded-2xl font-bold uppercase tracking-widest text-[11px] hover:bg-emerald-900 shadow-xl shadow-emerald-900/20 disabled:opacity-50 transition-all hover:-translate-y-0.5 disabled:hover:translate-y-0"
                                    >
                                        {isSubmitting ? "Enviando..." : "Confirmar Presença"}
                                    </button>
                                    <button onClick={() => setSelectedInvite(null)} className="w-full text-slate-400 text-[10px] uppercase tracking-[0.2em] mt-5 hover:text-slate-700 transition-colors font-semibold">Trocar convite</button>
                                </div>
                            )}
                        </div>
                    </section>

                    {/* Gifts Section */}
                    <section id="presentes" className="bg-white py-24 px-6 max-w-6xl mx-auto">
                        <div className="text-center mb-16">
                            <span className="text-[10px] text-emerald-600 uppercase tracking-[0.3em] font-bold mb-3 block">Mimo aos noivos</span>
                            <h2 className="text-4xl md:text-5xl font-playfair mb-4 text-slate-900">Lista de Presentes</h2>
                            <p className="text-slate-500 text-sm max-w-lg mx-auto font-light">Sua presença é nosso maior presente, mas se desejar nos abençoar, fique à vontade para escolher uma das opções abaixo.</p>
                            <div className="h-px w-20 bg-emerald-200 mx-auto mt-8"></div>
                        </div>
                        
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-10">
                            {GIFTS_DATA.map(gift => (
                                <div key={gift.id} className="bg-white group rounded-[2rem] p-4 border border-slate-100 shadow-[0_8px_30px_rgb(0,0,0,0.03)] hover:shadow-[0_20px_40px_rgb(0,0,0,0.08)] transition-all duration-500 flex flex-col hover:-translate-y-1">
                                    <div className="w-full aspect-square rounded-[1.5rem] overflow-hidden mb-6 relative bg-slate-50">
                                        <img src={gift.image} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" alt={gift.title} />
                                    </div>
                                    <div className="px-3 flex-grow flex flex-col">
                                        <h3 className="text-xl font-playfair text-slate-800 mb-2">{gift.title}</h3>
                                        <p className="text-slate-500 text-[12px] font-light mb-4 line-clamp-2 leading-relaxed">{gift.desc}</p>
                                        <div className="mt-auto flex justify-between items-center pt-5 border-t border-slate-50">
                                            <p className="text-lg font-semibold text-emerald-900">R$ {gift.price.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
                                            <button 
                                                onClick={() => setSelectedGift(gift)}
                                                className="bg-emerald-50 text-emerald-800 border border-emerald-100 px-5 py-2.5 rounded-full text-[9px] uppercase tracking-widest font-bold group-hover:bg-emerald-800 group-hover:text-white transition-all duration-300"
                                            >
                                                Presentear
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* MODAL DE PAGAMENTO */}
                    {selectedGift && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                            {/* Backdrop */}
                            <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onClick={() => setSelectedGift(null)}></div>
                            
                            {/* Modal Card */}
                            <div className="bg-white rounded-[2rem] p-6 md:p-8 w-full max-w-md relative z-10 shadow-2xl animate-fade-in flex flex-col items-center text-center">
                                <button onClick={() => setSelectedGift(null)} className="absolute top-5 right-6 text-slate-400 hover:text-slate-800 transition-colors text-xl font-bold">✕</button>
                                
                                <div className="w-32 h-32 rounded-full overflow-hidden mb-6 border-4 border-emerald-50 shadow-sm">
                                    <img src={selectedGift.image} className="w-full h-full object-cover" alt={selectedGift.title} />
                                </div>
                                
                                <h3 className="text-2xl font-playfair text-slate-900 mb-2">{selectedGift.title}</h3>
                                <p className="text-slate-500 text-sm mb-5 leading-relaxed px-2 font-light">{selectedGift.desc}</p>
                                <p className="text-3xl font-bold text-emerald-800 mb-8 font-playfair">R$ {selectedGift.price.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
                                
                                <div className="flex flex-col gap-3 w-full">
                                    {/* Botão PIX (Nubank style) */}
                                    <a 
                                        href={selectedGift.linkpix} 
                                        target="_blank" 
                                        className="w-full bg-[#32bcad] text-white py-4 rounded-2xl font-bold uppercase tracking-widest text-[11px] hover:bg-[#2aa395] shadow-lg shadow-[#32bcad]/20 hover:shadow-xl transition-all flex items-center justify-center gap-3 hover:-translate-y-0.5"
                                    >
                                       <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.01 21.05l-7.4-4.2a1.6 1.6 0 010-2.8l7.4-4.2 7.39 4.2a1.6 1.6 0 010 2.8l-7.4 4.2zm-9.01-6.1l8.1 4.6a1.8 1.8 0 001.8 0l8.1-4.6a1.8 1.8 0 000-3.13l-8.1-4.6a1.8 1.8 0 00-1.8 0l-8.1 4.6a1.8 1.8 0 000 3.14zM12 2.95l7.4 4.2-2.5 1.43-4.9-2.8-4.9 2.8-2.5-1.43 7.4-4.2z"/></svg>
                                       Pagar com Pix
                                    </a>
                                    
                                    {/* Botão Cartão (Mercado Pago style) */}
                                    <a 
                                        href={selectedGift.linkcartao} 
                                        target="_blank" 
                                        className="w-full bg-[#009ee3] text-white py-4 rounded-2xl font-bold uppercase tracking-widest text-[11px] hover:bg-[#0089c4] shadow-lg shadow-sky-500/20 hover:shadow-xl transition-all flex items-center justify-center gap-3 hover:-translate-y-0.5"
                                    >
                                       <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
                                       Pagar com Cartão
                                    </a>
                                </div>
                                
                                <p className="mt-6 text-[9px] text-slate-400 uppercase tracking-widest font-semibold flex items-center gap-2">
                                    <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                    Transação 100% Segura
                                </p>
                            </div>
                        </div>
                    )}

                    {/* Nossa História & Fotos Section */}
                    <section id="historia" className="bg-emerald-50/30 py-24 px-6 border-t border-emerald-50/50">
                        <div className="max-w-7xl mx-auto w-full">
                            <div className="text-center mb-16 max-w-3xl mx-auto animate-fade-in">
                                <span className="text-[10px] text-emerald-600 uppercase tracking-[0.3em] font-bold mb-3 block">Desde a Escola</span>
                                <h2 className="text-4xl md:text-5xl font-playfair mb-8 text-slate-900">Nossa História</h2>
                                
                                <div className="relative">
                                    <span className="text-6xl text-emerald-200 absolute -top-4 -left-2 md:-left-8 font-serif leading-none opacity-50">"</span>
                                    <p className="text-slate-600 text-sm md:text-base leading-relaxed md:leading-loose font-light italic relative z-10 px-4">
                                        O que começou com horas de conversas ininterruptas se transformou em uma vida inteira de parceria. Passamos pelo namoro, pelo amadurecimento e agora chegamos ao altar! Estamos muito felizes em ter vocês conosco para celebrar o nosso matrimônio e o amor que começou lá atrás, nos corredores da escola.
                                    </p>
                                    <span className="text-6xl text-emerald-200 absolute -bottom-8 -right-2 md:-right-8 font-serif leading-none opacity-50">"</span>
                                </div>
                            </div>

                            {/* Photo Grid - True Masonry (Sem cortes) */}
                            <div className="columns-1 sm:columns-2 md:columns-3 gap-4 md:gap-6 w-full animate-fade-in mt-20">
                                {COUPLE_PHOTOS.map((photo, index) => (
                                    <div key={index} className="relative overflow-hidden rounded-[2rem] group cursor-pointer shadow-[0_4px_20px_rgb(0,0,0,0.03)] hover:shadow-[0_10px_30px_rgb(0,0,0,0.08)] transition-all duration-500 break-inside-avoid mb-4 md:mb-6">
                                        <div className="absolute inset-0 bg-emerald-900/0 group-hover:bg-emerald-900/10 transition-colors z-10" />
                                        <img 
                                            src={photo} 
                                            alt={`Foto Casal ${index + 1}`} 
                                            className="w-full h-auto transform group-hover:scale-105 transition-transform duration-700" 
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <footer className="bg-emerald-900 text-white py-16 text-center border-t border-emerald-800">
                        <div className="flex justify-center mb-6">
                            <span className="text-3xl font-amsterdam">{COUPLE_NAMES}</span>
                        </div>
                        <p className="text-emerald-300 text-[9px] tracking-[0.4em] uppercase font-semibold">
                            Mal podemos esperar para celebrar com você!
                        </p>
                        <div className="mt-12 text-emerald-500 text-[8px] uppercase tracking-widest">
                            &copy; 2026 Júlia & Vitor
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
